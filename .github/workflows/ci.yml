name: CI

# 本仓库的开发机上没有 Flutter SDK（也不打算装），CI 是唯一的编译验证手段。
# 所以这里跑的四件事就是本仓库的验收标准，缺一不可：
#   analyze —— 静态检查（`flutter analyze` 对 info 级别也返回非零）
#   test    —— 模型解析 / API 契约 / 登录闸门
#   web     —— 次要形态，但必须能出包
#   apk     —— 主要形态
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# 连续推送时只保留最后一次，别让排队的任务互相挤。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 固定一个 stable 版本而不是跟着 `channel: stable` 漂：Flutter 的小版本
  # 会改 lint 的严格程度和 AGP 的兼容区间，不固定的话 CI 会在没人改代码的
  # 时候自己变红。升级是一次显式的提交。
  FLUTTER_VERSION: "3.47.7"

jobs:
  analyze:
    name: analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-web:
    name: build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # 不带 --base-href：部署路径由部署方决定，构建产物保持根路径默认值。
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web
          retention-days: 7

  build-android:
    name: build apk (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # debug 而不是 release：仓库里没有发布签名，release 会退回 debug 签名，
      # 产出一个看着像正式包的东西，比直接出 debug 包更危险。
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  build-linux:
    name: build linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Flutter 的 Linux 桌面构建走 CMake + GTK，runner 上默认没有这几样。
      # 缺了的话报错是 CMake 阶段的找不到包，和 Dart 代码无关。
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/linux/x64/release/bundle
          retention-days: 7

  # macOS / iOS 的工程文件已经在版本库里（由 scaffold.yml 生成），但**没有
  # CI 验证**：它们要 macos runner，计费是 ubuntu 的 10 倍，而目前没有 Apple
  # 设备上的实际需求。等真要发 iOS/macOS 包时再加，加之前它们算「生成了但
  # 未经编译验证」—— 这一点要记得，别当成已验证的。
